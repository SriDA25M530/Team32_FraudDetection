name: Simulated MLOps CI/CD Pipeline (Develop)

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # Phase 1: Continuous Integration (CI) - Code Checks & Linting
  # -------------------------------------------------------------
  continuous_integration:
    name: Code Quality and Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install CI Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 dvc

      - name: Lint Code with Flake8
        run: |
          # The --exit-zero flag ensures the pipeline passes even if there are formatting warnings.
          flake8 src/ dags/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Verify DVC Configuration
        run: |
          # Checks that DVC is initialized without pulling the massive datasets
          dvc status || echo "DVC is present but requires remote connection. Skipping data pull for CI."

      - name: Run Unit Tests (Simulated)
        run: |
          echo "Simulating pytest execution for data preprocessing..."
          echo "Test passed: Data schemas match."
          echo "Test passed: Model artifacts exist."

  # -------------------------------------------------------------
  # Phase 2: Continuous Deployment (CD) - Simulated Release
  # -------------------------------------------------------------
  continuous_deployment:
    name: Deploy to Airflow Server (Dry Run)
    needs: continuous_integration  # Wait for CI to pass
    if: github.ref == 'refs/heads/develop' # Only deploys when code is in the develop branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Simulate Server Connection and Deployment
        run: |
          echo "==================================================="
          echo "🚀 INITIATING MOCK DEPLOYMENT TO E2E SERVER (DEVELOP)"
          echo "==================================================="
          echo "1. Connecting to server da25m530@e2e-73-84..."
          echo "2. Pulling latest code from GitHub 'develop' branch..."
          echo "3. Running 'dvc pull' to fetch updated datasets..."
          echo "4. Copying team32_final_end_to_end_pipeline_V2.py to ~/airflow/dags/..."
          echo "5. Deployment Complete! Airflow scheduler will pick up the changes."
          echo "==================================================="

      - name: Trigger Airflow DAG via API
        run: |
          echo "Triggering Airflow DAG: team32_final_end_to_end_pipeline_V2"
          curl -X POST "https://lab.samsai.io/airflow/api/v1/dags/team32_final_end_to_end_pipeline_V2/dagRuns" \
            -H "accept: application/json" \
            -H "Content-Type: application/json" \
            --user "student:saffron-meadow-raven-sable-57" \
            -d '{}'